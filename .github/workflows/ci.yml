name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit, security and end-to-end tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check browser and extension scripts
        run: |
          node --check app.js
          node --check extension/content.js
          node --check extension/background.js
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json'))"
          node -e "JSON.parse(require('fs').readFileSync('site.webmanifest'))"
